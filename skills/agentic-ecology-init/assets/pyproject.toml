[project]
name = "agentic-ecology"
version = "0.1.0"
description = "Agentic tools for ecological modelling"
requires-python = ">=3.12"

dependencies = [
    "apache-beam[gcp]>=2.76.0",
    "perch-hoplite[tf,jax,onnx]",
    "pip",
    "pyarrow>=25.0.0",
    "soundfile",
    "speciesnet>=5.0.5",
]

[tool.uv]
package = false
environments = [
    "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
constraint-dependencies = [
    "numba >= 0.59.0",
    "torch < 2.13",
]

[tool.uv.sources]
perch-hoplite = { git = "https://github.com/google-research/perch-hoplite.git" }
